[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remarkable-ocr"
version = "0.1.0"
description = "Extract handwritten notes from Remarkable PDF exports using local OCR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "ollama>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
remarkable-ocr = "remarkable_ocr.cli:app"
