[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remarkable-ocr"
version = "0.1.0"
description = "Extract handwritten notes from Remarkable PDF exports using local OCR"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matthew Hagrelius", email = "mhagrelius@users.noreply.github.com" }]
keywords = ["remarkable", "ocr", "handwriting", "pdf", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "ollama>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/mhagrelius/remarkable-ocr"
Repository = "https://github.com/mhagrelius/remarkable-ocr"
Issues = "https://github.com/mhagrelius/remarkable-ocr/issues"

[project.scripts]
remarkable-ocr = "remarkable_ocr.cli:app"
